name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate catalogue, links between files and public tree
        run: python3 scripts/validate_catalogue.py check

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.1 "**/*.md"
